# Publica o painel de estoque da Link Store no GitHub Pages.
# Dispara a cada vez que o Steve sobe um dados.json novo (push na main).
# Substitui o build "legado" do Pages, que travava e deixava o painel congelado.
name: Publicar painel de estoque

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Se chegarem duas listas seguidas, a publicacao mais nova cancela a anterior:
# vale sempre o dado mais recente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Preparar o Pages
        uses: actions/configure-pages@v5

      - name: Empacotar o site (arquivos estaticos, sem Jekyll)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # MOTOR DE TEIMOSIA: ate 3 tentativas de publicar.
      # Se o GitHub engasgar (falha momentanea do Pages), espera e tenta de novo
      # sozinho, sem mandar e-mail de erro. So desiste se falhar as 3 vezes.
      - name: Publicar (1a tentativa)
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Esperar 20s antes de tentar de novo
        if: steps.deploy1.outcome == 'failure'
        run: sleep 20

      - name: Publicar (2a tentativa)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Esperar 40s antes da ultima tentativa
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 40

      - name: Publicar (3a e ultima tentativa)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
